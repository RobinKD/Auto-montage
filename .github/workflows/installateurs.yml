# Installateurs Auto-montage : AppImage (Linux), .exe (Windows), .dmg (macOS), et le programme
# compilé pour chaque système (programme.yml : auto-montage-<système>), joint à la version pour
# la mise à jour depuis l'interface.
# Lancé automatiquement quand un tag v<numéro> est poussé (git tag v0.44 && git push origin
# v0.44) : construit et vérifie les trois installateurs, puis publie la version avec eux. Le tag
# doit porter le numéro du fichier VERSION de son commit. Notes : les sections de CHANGELOG.md
# depuis la dernière version publiée (packaging/notes-version.sh), puis
# packaging/release-notes.md. Une version déjà publiée sans installateurs (ex. par
# packaging/publish-release.sh) les reçoit ; une version qui en a déjà n'est jamais refaite.
# Lancé à la main sur une branche (onglet Actions > Installateurs > Run workflow) : construction
# et vérification seulement, pour essayer une modification de l'empaquetage (fichiers dans l'onglet
# Actions, rubrique « Artifacts »).
name: Installateurs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Lecture seule par défaut ; seule la publication écrit (création de la version).
permissions:
  contents: read

jobs:
  programme:
    name: Programme
    uses: ./.github/workflows/programme.yml

  projet:
    name: Copie du projet
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"; PUBLISH=true
            # Le tag doit être posé sur le commit qui porte ce numéro dans VERSION.
            if [[ "$V" != "$(tr -d '[:space:]' < VERSION)" ]]; then
              echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas au fichier VERSION ($(cat VERSION)) de ce commit."
              exit 1
            fi
          else
            V="$(cat VERSION)-dev.${GITHUB_SHA::7}"
          fi
          # Numéro attendu (le tag ou VERSION) : chiffres et points, rien d'autre.
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+)*(-dev\.[0-9a-f]{7})?$ ]]; then
            echo "::error::Numéro de version invalide : $V"; exit 1
          fi
          # Jamais deux fois les installateurs d'un même numéro (relance du tag).
          if [[ "$PUBLISH" == true ]] && [[ "$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets | length' 2>/dev/null || echo 0)" != 0 ]]; then
            echo "::notice::La version v$V est déjà publiée avec ses installateurs : construction seulement."
            PUBLISH=false
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version : $V (publication : $PUBLISH)"
      - name: Copie du projet
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          packaging/make-payload.sh build/payload "$V"
          tar -czf payload.tgz -C build payload
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload.tgz

  # Chaque installateur reçoit la copie du projet (faite sur Linux : fins de ligne de
  # .gitattributes) et le programme compilé pour son système (programme.yml), dans
  # montage/bin/auto-montage[.exe]. Vérifications : installation dans un dossier temporaire, le
  # programme installé se lance, donne le numéro de VERSION (celui de la compilation, sans le
  # suffixe -dev d'un lancement à la main) et « stop » répond qu'il n'est pas lancé.
  linux:
    name: Linux (AppImage)
    needs: [projet, programme]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payload
      - uses: actions/download-artifact@v4
        with:
          name: programme-linux-x86_64
          path: prog
      - name: Construction
        run: |
          mkdir -p build && tar -xzf payload.tgz -C build
          mkdir -p build/payload/montage/bin
          cp prog/auto-montage-linux-x86_64 build/payload/montage/bin/auto-montage
          chmod 755 build/payload/montage/bin/auto-montage
          packaging/linux/build-appimage.sh build/payload dist
      - name: Vérification (installation dans un dossier temporaire)
        env:
          V: ${{ needs.projet.outputs.version }}
        run: |
          APP="$(ls dist/*.AppImage)"
          export AUTO_MONTAGE_HOME="$RUNNER_TEMP/am" XDG_DATA_HOME="$RUNNER_TEMP/share"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$APP" install
          AM="$AUTO_MONTAGE_HOME/montage/bin/auto-montage"
          test -x "$AM"
          test -x "$AUTO_MONTAGE_HOME/montage/am"
          test -d "$AUTO_MONTAGE_HOME/montage/public/rushes"
          test "$(cat "$AUTO_MONTAGE_HOME/.auto-montage-version")" = "$V"
          grep -q "Exec=" "$XDG_DATA_HOME/applications/auto-montage.desktop"
          test "$("$AM" version)" = "$(tr -d '[:space:]' < VERSION)"
          OUT="$("$AM" stop)"; echo "$OUT"
          echo "$OUT" | grep -q "n'est pas lancé"
          # Même chose par l'action « stop » de l'AppImage (sans fenêtre : message affiché).
          OUT="$("$APP" stop)"; echo "$OUT"
          echo "$OUT" | grep -q "n'est pas lancé"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    name: Windows (.exe)
    needs: [projet, programme]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payload
      - uses: actions/download-artifact@v4
        with:
          name: programme-windows-x86_64
          path: prog
      - name: Copie du projet et programme
        shell: bash
        run: |
          mkdir -p build && tar -xzf payload.tgz -C build
          mkdir -p build/payload/montage/bin
          cp prog/auto-montage-windows-x86_64.exe build/payload/montage/bin/auto-montage.exe
      - name: Syntaxe des scripts PowerShell (Windows PowerShell 5.1), s'il y en a
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem build\payload -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $bad++; Write-Host "$($f.Name) : $($errors[0].Message)" }
          }
          if ($bad) { exit 1 }
      - name: Construction (Inno Setup)
        shell: pwsh
        env:
          V: ${{ needs.projet.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:V" "/DPayload=$PWD\build\payload" "/DOutDir=$PWD\dist" packaging\windows\auto-montage.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Vérification (installation silencieuse)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'am'
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', "/DIR=$dir" -Wait
          $am = "$dir\montage\bin\auto-montage.exe"
          if (-not (Test-Path $am)) { throw 'Programme non installé' }
          if (-not (Test-Path "$dir\montage\public\rushes")) { throw 'Dossier des rushes manquant' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Auto-montage.lnk'
          if (-not (Test-Path $lnk)) { throw 'Raccourci du bureau manquant' }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "Raccourci : $($sc.TargetPath) $($sc.Arguments)"
          if ($sc.TargetPath -notlike '*\montage\bin\auto-montage.exe' -or $sc.Arguments -ne 'start') { throw 'Raccourci du bureau incorrect' }
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Auto-montage'
          foreach ($n in 'Téléchargements', 'Dossier des rushes', 'Claude Code', 'Arrêter Auto-montage') {
            if (-not (Test-Path (Join-Path $menu "$n.lnk"))) { throw "Raccourci « $n » manquant" }
          }
          $v = (& $am version | Out-String).Trim()
          $attendu = (Get-Content VERSION -Raw).Trim()
          Write-Host "Version du programme : $v"
          if ($v -ne $attendu) { throw "version $v au lieu de $attendu" }
          $out = & $am stop | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "auto-montage stop : code $code" }
          if ($out -notmatch 'pas lanc') { throw 'message attendu absent' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    name: macOS (.dmg)
    needs: [projet, programme]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payload
      - uses: actions/download-artifact@v4
        with:
          pattern: programme-macos-*
          path: prog
          merge-multiple: true
      - name: Programme universel (Apple Silicon et Intel)
        run: |
          mkdir -p build && tar -xzf payload.tgz -C build
          mkdir -p build/payload/montage/bin
          BIN=build/payload/montage/bin/auto-montage
          lipo -create prog/auto-montage-macos-arm64 prog/auto-montage-macos-x86_64 -output "$BIN"
          codesign --force --sign - "$BIN"
          chmod 755 "$BIN"
          ARCHS="$(lipo -archs "$BIN")"; echo "Programme : $ARCHS"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
      - name: Construction
        run: packaging/macos/build-dmg.sh build/payload dist
      - name: Vérification (montage du .dmg, première installation)
        env:
          V: ${{ needs.projet.outputs.version }}
        run: |
          DMG="$(ls dist/*.dmg)"
          hdiutil attach "$DMG" -mountpoint /tmp/am-dmg -nobrowse
          APP=/tmp/am-dmg/Auto-montage.app
          codesign --verify --deep "$APP"
          test -f "$APP/Contents/Resources/applet.icns"
          test -f "/tmp/am-dmg/LISEZ-MOI - première ouverture.txt"
          # La commande donnée aux utilisateurs pour lever le blocage de Gatekeeper fonctionne.
          cp -R "$APP" "$RUNNER_TEMP/Auto-montage.app"
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$RUNNER_TEMP/Auto-montage.app"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/Auto-montage.app"
          if xattr -p com.apple.quarantine "$RUNNER_TEMP/Auto-montage.app" 2>/dev/null; then
            echo "L'attribut de quarantaine est toujours là"; exit 1
          fi
          export AUTO_MONTAGE_HOME="$RUNNER_TEMP/am"
          bash "$APP/Contents/Resources/first-run.sh" "$APP/Contents/Resources/payload"
          AM="$AUTO_MONTAGE_HOME/montage/bin/auto-montage"
          test -x "$AM"
          test -d "$AUTO_MONTAGE_HOME/montage/public/rushes"
          test "$(cat "$AUTO_MONTAGE_HOME/.auto-montage-version")" = "$V"
          codesign --verify "$AM"
          ARCHS="$(lipo -archs "$AM")"; echo "Programme installé : $ARCHS"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
          test "$("$AM" version)" = "$(tr -d '[:space:]' < VERSION)"
          # Partie Intel (Rosetta, si la machine l'a).
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            test "$(arch -x86_64 "$AM" version)" = "$(tr -d '[:space:]' < VERSION)"
          fi
          OUT="$("$AM" stop)"; echo "$OUT"
          echo "$OUT" | grep -q "n'est pas lancé"
          hdiutil detach /tmp/am-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  publication:
    name: Publication
    if: needs.projet.outputs.publish == 'true'
    needs: [projet, programme, linux, windows, macos]
    runs-on: ubuntu-latest
    # Une publication à la fois (ex. deux tags poussés ensemble).
    permissions:
      contents: write
    concurrency:
      group: publication-installateurs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags des versions déjà publiées, pour les notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{linux,windows,macos,programme-*}"
          merge-multiple: true
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.projet.outputs.version }}
        run: |
          ls -la dist
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Publiée sans installateurs (packaging/publish-release.sh) : on les ajoute.
            gh release upload "v$V" dist/Auto-montage-* dist/auto-montage-* dist/whisper-* --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          packaging/notes-version.sh --installateurs "$V" > /dev/null
          gh release create "v$V" dist/Auto-montage-* dist/auto-montage-* dist/whisper-* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Auto-montage $V" --notes-file "dist/notes-v$V.md" --prerelease
