[package]
name = "auto-montage"
version = "0.68.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Auto-montage : préparation des rushes, montage et interface locale (version native)"

[[bin]]
name = "auto-montage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
chrono = "0.4"
sha1 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
hound = "3"
ttf-parser = "0.25"
rustybuzz = "0.20"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }
tar = "0.4"
flate2 = "1"
percent-encoding = "2"
mime_guess = "2"
fs4 = { version = "0.13", features = ["sync"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
portable-pty = "0.8"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
woff2-patched = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
